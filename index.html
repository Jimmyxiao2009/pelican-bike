            <path d="M246,-208 C300,-196 348,-202 386,-188" fill="none" stroke="#e08a28" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
          </g>

          <g id="fish">
            <path d="M-6,0 C2,-7 14,-6 18,0 C12,2 12,7 18,11 C8,7 0,7 -6,3 Z" fill="#ff7b62" stroke="#243038" stroke-width="1.4" stroke-linejoin="round"/>
            <circle cx="12" cy="3" r="1" fill="#243038"/>
          </g>
        </g>
      </g>

      <g fill="none" stroke-linecap="round">
        <path d="M168,-132 L186,-164" stroke="#243038" stroke-width="10"/>
        <path d="M168,-132 L186,-164" stroke="#d5dde3" stroke-width="6"/>
        <path d="M146,-156 C176,-184 224,-180 240,-156" stroke="#243038" stroke-width="12"/>
        <path d="M146,-156 C176,-184 224,-180 240,-156" stroke="#3a4248" stroke-width="8"/>
        <path d="M146,-156 C158,-170 172,-166 176,-156" stroke="#2a3330" stroke-width="11"/>
        <path d="M214,-174 C230,-170 240,-160 236,-152" stroke="#2a3330" stroke-width="11"/>
        <circle cx="208" cy="-176" r="5.5" fill="#eef3f6" stroke="#243038" stroke-width="1.5"/>
        <path d="M208,-176 v5" stroke="#243038" stroke-width="1.2"/>
      </g>

      <g id="bobFront">
        <g stroke="#243038" stroke-linejoin="round" stroke-linecap="round">
          <path d="M126,-196 C158,-222 190,-208 214,-170 C198,-158 170,-180 146,-192 C132,-188 122,-186 126,-196 Z" fill="#fffaf3" stroke-width="2.5"/>
          <path d="M198,-174 C218,-182 232,-166 222,-156 C208,-162 198,-164 198,-174 Z" fill="#243038" stroke-width="1.4"/>
          <path d="M190,-164 C212,-166 228,-150 216,-140 C202,-148 192,-156 190,-164 Z" fill="#243038" stroke-width="1.4"/>
          <path d="M182,-156 C200,-148 214,-134 200,-130 C188,-140 180,-148 182,-156 Z" fill="#243038" stroke-width="1.4"/>
        </g>
      </g>
    </g>

    <g id="groundFront">
      <use href="#grassCluster" transform="translate(16,702)"/>
      <use href="#grassCluster" transform="translate(316,702)"/>
      <use href="#grassCluster" transform="translate(616,702)"/>
      <use href="#grassCluster" transform="translate(916,702)"/>
      <use href="#grassCluster" transform="translate(1216,702)"/>
      <use href="#grassCluster" transform="translate(1516,702)"/>
    </g>
    <g id="critters">
      <g transform="translate(260,632)"><g class="crab-bob"><use href="#crabGraphic"/></g></g>
      <g transform="translate(1460,632)"><g class="crab-bob"><use href="#crabGraphic"/></g></g>
    </g>

    <text x="48" y="86" fill="#1c4258" stroke="#fff8ee" stroke-width="8" paint-order="stroke" stroke-linejoin="round"
          font-family="KaiTi, STKaiti, Songti SC, serif" font-size="54">鹈鹕骑自行车</text>
    <text x="52" y="122" fill="#1c4258" opacity="0.78"
          font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18">海风正好，鱼还在喉囊里</text>
  </svg>

  <button id="toggle" class="toggle" type="button">暂停</button>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const BB = { x: 100, y: -6 };
    const CRANK = 22;
    const HIP = { x: 84, y: -112 };
    const HIP_FAR = { x: 76, y: -108 };
    const THIGH = 72;
    const SHIN = 70;
    const WHEEL_R = 56;
    const GEAR = 2;
    const CRANK_W = (Math.PI * 2) / 1.35;

    const rig = document.getElementById("rig");
    const wheelR = document.getElementById("wheelR");
    const wheelF = document.getElementById("wheelF");
    const cogTeeth = document.getElementById("cogTeeth");
    const crankFar = document.getElementById("crankFar");
    const crankNear = document.getElementById("crankNear");
    const uprightFar = document.getElementById("uprightFar");
    const uprightNear = document.getElementById("uprightNear");
    const tiltFar = crankFar.querySelector(".foot-tilt");
    const tiltNear = crankNear.querySelector(".foot-tilt");
    const chainring = document.getElementById("chainring");
    const chain = document.getElementById("chain");
    const chainHi = document.getElementById("chainHi");
    const bobBack = document.getElementById("bobBack");
    const bobFront = document.getElementById("bobFront");
    const balanceWing = document.getElementById("balanceWing");
    const head = document.getElementById("head");
    const pouch = document.getElementById("pouch");
    const fish = document.getElementById("fish");
    const lid = document.getElementById("lid");
    const groundBack = document.getElementById("groundBack");
    const groundFront = document.getElementById("groundFront");
    const critters = document.getElementById("critters");
    const crabBobs = document.querySelectorAll(".crab-bob");
    const clouds = document.getElementById("clouds");
    const dunes = document.getElementById("dunes");
    const waves = document.getElementById("waves");
    const gullWings = document.querySelectorAll(".gull-wing");
    const puffs = document.querySelectorAll(".puff");
    const btn = document.getElementById("toggle");

    const seg = (id) => document.getElementById(id);

    function addTeeth(parent, count, inner, outer, width) {
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2;
        const line = document.createElementNS(SVG_NS, "line");
        line.setAttribute("x1", (Math.cos(a) * inner).toFixed(2));
        line.setAttribute("y1", (Math.sin(a) * inner).toFixed(2));
        line.setAttribute("x2", (Math.cos(a) * outer).toFixed(2));
        line.setAttribute("y2", (Math.sin(a) * outer).toFixed(2));
        if (width) line.setAttribute("stroke-width", width);
        parent.appendChild(line);
      }
    }
    addTeeth(document.getElementById("teeth"), 16, 21, 28);
    addTeeth(cogTeeth, 10, 10, 15);

    chain.setAttribute("stroke", "#4e463f");
    chain.setAttribute("stroke-width", "3.8");
    chain.setAttribute("stroke-dasharray", "3.4 2.3");
    chainHi.setAttribute("stroke", "#b3a38c");
    chainHi.setAttribute("stroke-width", "1.7");
    chainHi.setAttribute("stroke-dasharray", "3.4 2.3");

    function pedal(angle) {
      return {
        x: BB.x + Math.cos(angle) * CRANK,
        y: BB.y + Math.sin(angle) * CRANK,
      };
    }

    function kneePoint(hip, foot) {
      const dx = foot.x - hip.x;
      const dy = foot.y - hip.y;
      const dist = Math.max(1, Math.hypot(dx, dy));
      const slack = Math.max(0, THIGH + SHIN - Math.min(dist, THIGH + SHIN));
      const t = THIGH / (THIGH + SHIN);
      const mx = hip.x + dx * t;
      const my = hip.y + dy * t;
      const cands = [
        { x: -dy / dist, y: dx / dist },
        { x: dy / dist, y: -dx / dist },
      ];
      let best = cands[0];
      let score = -1e9;
      for (const c of cands) {
        const s = -c.y * 1.35 + c.x * 1.05;
        if (s > score) {
          score = s;
          best = c;
        }
      }
      const offset = Math.min(46, 10 + slack * 0.58);
      return { x: mx + best.x * offset, y: my + best.y * offset };
    }

    function setLine(el, x1, y1, x2, y2) {
      el.setAttribute("x1", x1);
      el.setAttribute("y1", y1);
      el.setAttribute("x2", x2);
      el.setAttribute("y2", y2);
    }

    function setLeg(prefix, hip, foot) {
      const knee = kneePoint(hip, foot);
      const thigh = seg(prefix + "Thigh");
      const shin = seg(prefix + "Shin");
      if (thigh) setLine(thigh, hip.x, hip.y, knee.x, knee.y);
      if (shin) setLine(shin, knee.x, knee.y, foot.x, foot.y);
      const inkT = seg(prefix + "ThighInk");
      const inkS = seg(prefix + "ShinInk");
      if (inkT) setLine(inkT, hip.x, hip.y, knee.x, knee.y);
      if (inkS) setLine(inkS, knee.x, knee.y, foot.x, foot.y);
      const cap = seg(prefix + "Knee");
      const capInk = seg(prefix + "KneeInk");
      if (cap) { cap.setAttribute("cx", knee.x); cap.setAttribute("cy", knee.y); }
      if (capInk) { capInk.setAttribute("cx", knee.x); capInk.setAttribute("cy", knee.y); }
      const ankle = seg(prefix + "Ankle");
      if (ankle) { ankle.setAttribute("cx", foot.x); ankle.setAttribute("cy", foot.y); }
    }

    let elapsed = 0;
    let paused = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let last = null;

    function renderButton() {
      btn.textContent = paused ? "播放" : "暂停";
      btn.setAttribute("aria-label", paused ? "播放动画" : "暂停动画");
      btn.setAttribute("aria-pressed", String(paused));
    }

    function pose(time) {
      const angle = time * CRANK_W;
      const wheel = angle * GEAR;
      const deg = angle * 180 / Math.PI;
      const wheelDeg = wheel * 180 / Math.PI;
      const travel = wheel * WHEEL_R;
      const vibe = Math.sin(wheel * 3) * 0.7;
      const bob = Math.sin(angle * 2) * 2.3;
      const lean = Math.sin(angle) * 1.5;

      rig.setAttribute("transform", "translate(450," + (548 + vibe) + ")");
      wheelR.setAttribute("transform", "rotate(" + wheelDeg + ")");
      wheelF.setAttribute("transform", "rotate(" + wheelDeg + ")");
      cogTeeth.setAttribute("transform", "rotate(" + wheelDeg + ")");

      crankNear.setAttribute("transform", "translate(" + BB.x + "," + BB.y + ") rotate(" + deg + ")");
      crankFar.setAttribute("transform", "translate(" + BB.x + "," + BB.y + ") rotate(" + (deg + 180) + ")");
      uprightNear.setAttribute("transform", "translate(" + CRANK + ",0) rotate(" + (-deg) + ")");
      uprightFar.setAttribute("transform", "translate(" + CRANK + ",0) rotate(" + (-(deg + 180)) + ")");
      const tiltN = Math.sin(angle) * 12;
      const tiltF = Math.sin(angle + Math.PI) * 12;
      tiltNear.setAttribute("transform", "rotate(" + tiltN + ")");
      tiltFar.setAttribute("transform", "rotate(" + tiltF + ")");

      chainring.setAttribute("transform", "translate(" + BB.x + "," + BB.y + ") rotate(" + deg + ")");
      const dash = (-angle * 26).toFixed(2);
      chain.setAttribute("stroke-dashoffset", dash);
      chainHi.setAttribute("stroke-dashoffset", dash);

      const bobTf = "translate(0," + bob + ") rotate(" + lean + " " + HIP.x + " " + HIP.y + ")";
      bobBack.setAttribute("transform", bobTf);
      bobFront.setAttribute("transform", bobTf);

      const hipN = { x: HIP.x, y: HIP.y + bob };
      const hipF = { x: HIP_FAR.x, y: HIP_FAR.y + bob };
      setLeg("near", hipN, pedal(angle));
      setLeg("far", hipF, pedal(angle + Math.PI));

      const flap = Math.sin(time * 2.5) * 8 - lean * 0.5;
      balanceWing.setAttribute("transform", "rotate(" + flap + " 84 -176)");
      const nod = Math.sin(angle * 2 + 0.8) * 2.1;
      head.setAttribute("transform", "rotate(" + nod + " 196 -262)");
      const sy = 1 + Math.sin(angle * 2 + 0.55) * 0.055;
      const sx = 1 / sy;
      pouch.setAttribute("transform", "translate(310,-214) scale(" + sx + "," + sy + ") translate(-310,214)");
      const wag = Math.sin(time * 9) * 16;
      fish.setAttribute("transform", "translate(338,-188) rotate(" + wag + ")");

      const cycle = time % 4.6;
      const blink = cycle > 4.28 ? Math.sin((cycle - 4.28) / 0.32 * Math.PI) : 0;
      lid.setAttribute("transform", "translate(0," + (-8 + blink * 9) + ")");

      groundBack.setAttribute("transform", "translate(" + (-(travel % 300)) + ",0)");
      groundFront.setAttribute("transform", "translate(" + (-(travel % 300)) + ",0)");
      critters.setAttribute("transform", "translate(" + (-(travel % 1200)) + ",0)");
      clouds.setAttribute("transform", "translate(" + (-(travel * 0.16 % 1200)) + ",0)");
      dunes.setAttribute("transform", "translate(" + (-(travel * 0.06 % 1200)) + ",0)");
      waves.setAttribute("transform", "translate(" + (-(travel * 0.38 % 1200)) + ",0)");

      const flapY = (0.35 + Math.abs(Math.sin(time * 4.2)) * 1.15).toFixed(3);
      const flapY2 = (0.35 + Math.abs(Math.sin(time * 4.2 + 1.2)) * 1.15).toFixed(3);
      gullWings[0].setAttribute("transform", "scale(1," + flapY + ")");
      gullWings[1].setAttribute("transform", "scale(1," + flapY2 + ")");

      for (let i = 0; i < puffs.length; i++) {
        const phase = ((travel * 0.012) + i * 0.33) % 1;
        const px = -8 - phase * 78;
        const py = 50 - phase * 16;
        puffs[i].setAttribute("transform", "translate(" + px.toFixed(1) + "," + py.toFixed(1) + ") scale(" + (0.55 + phase).toFixed(2) + ")");
        puffs[i].setAttribute("opacity", ((1 - phase) * 0.45).toFixed(3));
      }

      const crabTilt = Math.sin(time * 7) * 5;
      crabBobs.forEach((el) => el.setAttribute("transform", "rotate(" + crabTilt + ")"));
    }

    function tick(now) {
      if (last == null) last = now;
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (!paused) elapsed += dt;
      pose(elapsed);
      requestAnimationFrame(tick);
    }

    btn.addEventListener("click", () => {
      paused = !paused;
      last = null;
      renderButton();
    });
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" && e.target === document.body) {
        e.preventDefault();
        paused = !paused;
        last = null;
        renderButton();
      }
    });

    renderButton();
    pose(0);
    requestAnimationFrame(tick);
  </script>
</body>
</html>
